version: "3.8"

services:
  # Energy Trading Gateway (Orchestrator) - Now in Docker
  gateway:
    build:
      context: ./simple-gateway
      dockerfile: Dockerfile
    container_name: energy-gateway
    networks:
      - energy_network
    ports:
      - "8080:8080" # WebSocket Gateway
    environment:
      - RUST_LOG=info
    command: ["/app/simple-gateway"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Dashboard - Run locally instead of in Docker
  # Run with: cd frontend && npm install && npm run dev

  # PostgreSQL Database (Optional - not used in simple gateway)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: energy-postgres
  #   networks:
  #     - energy_network
  #   environment:
  #     - POSTGRES_DB=energy_trading
  #     - POSTGRES_USER=energy_user
  #     - POSTGRES_PASSWORD=energy_pass
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./energy-trading-rust/migrations:/docker-entrypoint-initdb.d
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U energy_user -d energy_trading"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # BESS Node 001 (15kWh Residential Battery)
  bess-001:
    build:
      context: ./containers/bess-node
      dockerfile: Dockerfile
    container_name: bess-001
    networks:
      - energy_network
    environment:
      - NODE_ID=001
      - NODE_TYPE=BESS
      - CAPACITY_KWH=15
      - INITIAL_ENERGY=12.5
      - GATEWAY_HOST=172.18.0.1
      - GATEWAY_PORT=8080
      - MULTICAST_GROUP=224.0.0.1
      - MULTICAST_PORT=8888
    depends_on:
      - gateway
    restart: unless-stopped

  # BESS Node 002 (20kWh Commercial Battery)
  bess-002:
    build:
      context: ./containers/bess-node
      dockerfile: Dockerfile
    container_name: bess-002
    networks:
      - energy_network
    environment:
      - NODE_ID=002
      - NODE_TYPE=BESS
      - CAPACITY_KWH=20
      - INITIAL_ENERGY=18.0
      - GATEWAY_HOST=172.18.0.1
      - GATEWAY_PORT=8080
      - MULTICAST_GROUP=224.0.0.1
      - MULTICAST_PORT=8888
    depends_on:
      - gateway
    restart: unless-stopped

  # BESS Node 003 (10kWh Small Residential)
  bess-003:
    build:
      context: ./containers/bess-node
      dockerfile: Dockerfile
    container_name: bess-003
    networks:
      - energy_network
    environment:
      - NODE_ID=003
      - NODE_TYPE=BESS
      - CAPACITY_KWH=10
      - INITIAL_ENERGY=8.5
      - GATEWAY_HOST=172.18.0.1
      - GATEWAY_PORT=8080
      - MULTICAST_GROUP=224.0.0.1
      - MULTICAST_PORT=8888
    depends_on:
      - gateway
    restart: unless-stopped

  # Aggregator 001 (Energy Buyer)
  aggregator-001:
    build:
      context: ./containers/aggregator
      dockerfile: Dockerfile
    container_name: aggregator-001
    networks:
      - energy_network
    environment:
      - AGGREGATOR_ID=001
      - NODE_TYPE=AGGREGATOR
      - STRATEGY=CONSERVATIVE
      - MAX_BID_PRICE=800
      - GATEWAY_HOST=172.18.0.1
      - GATEWAY_PORT=8080
      - MULTICAST_GROUP=224.0.0.1
      - MULTICAST_PORT=8888
    depends_on:
      - gateway
    restart: unless-stopped

  # Aggregator 002 (Energy Buyer)
  aggregator-002:
    build:
      context: ./containers/aggregator
      dockerfile: Dockerfile
    container_name: aggregator-002
    networks:
      - energy_network
    environment:
      - AGGREGATOR_ID=002
      - NODE_TYPE=AGGREGATOR
      - STRATEGY=AGGRESSIVE
      - MAX_BID_PRICE=1200
      - GATEWAY_HOST=172.18.0.1
      - GATEWAY_PORT=8080
      - MULTICAST_GROUP=224.0.0.1
      - MULTICAST_PORT=8888
    depends_on:
      - gateway
    restart: unless-stopped

  # Note: Using local Solana installation instead of Docker container
  # Start with: solana-test-validator --reset --quiet --rpc-port 8899 --rpc-bind-address 0.0.0.0

# Custom network for container communication
networks:
  energy_network:
    driver: bridge

volumes:
  postgres_data: # Kept for potential future use, but not actively used
